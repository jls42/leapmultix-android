# Contrôle de l'appli à chaque push et chaque PR (Dependabot compris) : scripts (shellcheck),
# dépendances npm, synchronisation Capacitor, Android Lint (toute remarque est une erreur) et
# construction de l'AAB. Le site et la voix n'y sont pas : une page d'essai et deux packs d'un
# fichier les remplacent, l'appli complète se construit en local (scripts/build-aab.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scripts (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Dépendances npm
        run: npm ci

      - name: Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Site d'essai et packs
        run: |
          mkdir -p www
          printf '<!doctype html><title>LeapMultix</title>\n' > www/index.html
          npx cap sync android
          for pack in images_pack voix_pack; do
            mkdir -p "android/$pack/src/main/assets/public"
            printf 'essai\n' > "android/$pack/src/main/assets/public/essai.txt"
          done

      - name: Android Lint et AAB
        working-directory: android
        run: ./gradlew --no-daemon lintDebug bundleDebug

  # Notifications Telegram, comme pour le site du jeu : après chaque push sur main, un message
  # dit si les contrôles sont passés, avec le titre du commit ; un échec donne le lien du run.
  # Un run rouge ne se voit pas depuis un téléphone : cette alerte en est le témoin. Job à
  # part, lancé quoi qu'il arrive (always()), sans aucun droit sur le dépôt. Une pull request
  # n'envoie rien (et n'a pas accès aux secrets). Secrets du dépôt : TELEGRAM_BOT_TOKEN et
  # TELEGRAM_CHAT_ID ; sans eux, le job le dit par un avertissement et n'échoue pas.
  notifications:
    name: Notifications
    runs-on: ubuntu-24.04
    needs: [android]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions: {}
    steps:
      # Le titre du commit passe par env (jamais interpolé dans le shell). La réponse de l'API
      # est vérifiée : un refus de Telegram fait échouer l'étape au lieu de prétendre avoir
      # prévenu.
      - name: Message Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULTAT: ${{ needs.android.result }}
          TITRE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::Secrets TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID absents : aucune notification envoyée"
            exit 0
          fi
          TITRE=$(printf '%s' "$TITRE" | head -n 1)
          if [ "$RESULTAT" = success ]; then
            TXT="✅ Appli Android LeapMultix : main à jour, contrôles verts — $TITRE"
          else
            TXT="⛔ Appli Android LeapMultix : les contrôles de main ont échoué ($RESULTAT) — $TITRE. Détail : $RUN_URL"
          fi
          REP=$(curl -sS --max-time 25 --retry 3 --retry-delay 5 \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TXT}")
          if printf '%s' "$REP" | grep -q '"ok":true'; then
            echo "notification envoyée"
          else
            echo "::error::Telegram a refusé la notification : $REP"
            exit 1
          fi
